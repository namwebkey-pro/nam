<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo Key</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0e14;
    font-family: 'Segoe UI', sans-serif;
    color: #cdd6e0;
    padding: 30px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    border-radius: 8px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab.active {
    background: linear-gradient(90deg, #3a0d18, #1a0a10);
    color: #ff2d55;
    border: 1px solid #ff2d55;
  }
  .tab.inactive {
    background: #10151d;
    color: #5a6472;
    border: 1px solid #1e2632;
  }

  .card {
    background: #0d1219;
    border: 1px solid #1c2632;
    border-radius: 12px;
    padding: 24px;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .hex {
    width: 38px; height: 38px;
    border: 1px solid #ff2d55;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #ff2d55;
    font-size: 18px;
  }
  .card-title h2 {
    color: #fff;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .card-title small {
    color: #4a5563;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .label {
    font-size: 11px;
    color: #6b7684;
    letter-spacing: 1px;
    margin: 18px 0 8px;
    text-transform: uppercase;
  }

  .row {
    display: flex;
    gap: 12px;
  }
  .option {
    flex: 1;
    padding: 16px;
    text-align: center;
    border-radius: 8px;
    background: #0a0f16;
    border: 1px solid #1c2632;
    color: #cdd6e0;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }
  .option.selected {
    border: 1px solid #ff2d55;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,45,85,0.3);
  }

  select {
    width: 100%;
    padding: 16px;
    background: #0a0f16;
    border: 1px solid #1c2632;
    border-radius: 8px;
    color: #cdd6e0;
    font-size: 14px;
    outline: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg fill='%236b7684' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }

  .hint {
    font-size: 11px;
    color: #4a5563;
    margin-top: 8px;
  }

  .btn-create {
    width: 100%;
    margin-top: 28px;
    padding: 18px;
    background: transparent;
    border: 1px solid #ff2d55;
    border-radius: 8px;
    color: #ff2d55;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.25s;
  }
  .btn-create:hover {
    background: #ff2d55;
    color: #fff;
    box-shadow: 0 0 20px rgba(255,45,85,0.6);
  }
</style>
</head>
<body>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active">⚙ TẠO KEY</div>
    <div class="tab inactive">📄 LỊCH SỬ</div>
  </div>

  <!-- Card -->
  <div class="card">
    <div class="card-title">
      <div class="hex">⬡</div>
      <div>
        <h2>TẠO KEY</h2>
        <small>// CHỌN THIẾT BỊ MAN KEY</small>
      </div>
    </div>

    <!-- Chọn sản phẩm -->
    <div class="label">Chọn sản phẩm</div>
    <div class="row">
      <div class="option selected">◆ PROXY IPA</div>
      <div class="option">◆ PROXY VPN</div>
    </div>
    <div class="hint">KEY CHỈ ĐƯỢC RANDOM TRONG SẢN PHẨM ĐÃ CHỌN</div>

    <!-- Loại key -->
    <div class="label">Loại key</div>
    <select>
      <option>KEY NGÀY</option>
      <option>KEY TUẦN</option>
      <option>KEY THÁNG</option>
    </select>
    <div class="hint">CHỌN ĐÚNG LOẠI KEY - HỆ THỐNG CHỈ RANDOM TRONG LOẠI ĐÃ CHỌN</div>

    <!-- Số lượng -->
    <div class="label">Số lượng key / lần</div>
    <select>
      <option>1 KEY</option>
      <option>5 KEY</option>
      <option>10 KEY</option>
    </select>
    <div class="hint">KHÔNG GIỚI HẠN SỐ LẦN TẠO TRONG NGÀY - HỖ TRỢ 1-10 KEY</div>

    <!-- Nút tạo -->
    <button class="btn-create">⚙ TẠO KEY NGAY</button>
  </div>

  <script>
    // Đổi chọn sản phẩm
    document.querySelectorAll('.option').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
      };
    });

    // Nút tạo key
    document.querySelector('.btn-create').onclick = () => {
      alert('Đã tạo key thành công! (demo)');
    };
  </script>

</body>
</html>
